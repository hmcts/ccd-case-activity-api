dependencyResolutionManagement {
    repositories {
        // Try HMCTS Artifactory first
        maven {
            name = 'HMCTSArtifactory'
            url = uri(
                'https://artifactory.platform.hmcts.net/artifactory/maven-remotes'
            )

            credentials {
                username = System.getenv('ARTIFACTORY_USERNAME')
                password = System.getenv('ARTIFACTORY_PASSWORD')
            }

            authentication {
                basic(BasicAuthentication)
            }
        }

        // HMCTS libraries
        maven {
            name = 'HMCTSAzureArtifacts'
            url = uri(
                'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
            )

            content {
                includeGroupByRegex 'com\\.github\\.hmcts.*'
            }

            credentials {
                username = System.getenv('AZURE_ARTIFACTS_USERNAME')
                password = System.getenv('AZURE_ARTIFACTS_TOKEN')
            }

            authentication {
                basic(BasicAuthentication)
            }
        }

        // Fallback only if the dependency is unavailable above
        mavenCentral()

        // Local development only
        if (!System.getenv('CI')) {
            mavenLocal()
        }
    }
}
