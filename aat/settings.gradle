pluginManagement {
    repositories {
        // Used first for Gradle plugin dependencies such as
        // jackson-databind, commons-io, plexus-utils and jsoup
        mavenCentral()

        // HMCTS Artifactory
        maven {
            name = 'HMCTSArtifactory'
            url = uri(
                'https://artifactory.platform.hmcts.net/artifactory/maven-remotes'
            )
        }

        // Required to locate plugins published only to the Gradle Plugin Portal
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        // First choice for normal project dependencies
        maven {
            name = 'HMCTSArtifactory'
            url = uri(
                'https://artifactory.platform.hmcts.net/artifactory/maven-remotes'
            )
        }

        // HMCTS libraries
        maven {
            name = 'HMCTSAzureArtifacts'
            url = uri(
                'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
            )

            content {
                includeGroup 'com.github.hmcts'
            }
        }

        // Fallback for normal project dependencies
        mavenCentral()

        // Local development only
        if (!System.getenv('CI')) {
            mavenLocal()
        }
    }
}
